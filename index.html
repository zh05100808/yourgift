<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حنا خان — یومِ پیدائش</title>

    <!-- Urdu Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================================================
         WELCOME PAGE
    ========================================================== -->

    <main class="welcome-page" id="welcomePage">

        <!-- Animated Background -->
        <div class="background-effects">

            <div class="glow glow-one"></div>
            <div class="glow glow-two"></div>
            <div class="glow glow-three"></div>

            <!-- Floating decorations -->
            <span class="floating-heart heart-1">♥</span>
            <span class="floating-heart heart-2">♥</span>
            <span class="floating-heart heart-3">♥</span>

            <span class="star star-1">✦</span>
            <span class="star star-2">✧</span>
            <span class="star star-3">✦</span>
            <span class="star star-4">✧</span>

            <span class="particle particle-1"></span>
            <span class="particle particle-2"></span>
            <span class="particle particle-3"></span>
            <span class="particle particle-4"></span>
            <span class="particle particle-5"></span>
            <span class="particle particle-6"></span>

            <!-- Balloons -->
            <div class="balloon balloon-one"></div>
            <div class="balloon balloon-two"></div>
            <div class="balloon balloon-three"></div>
            <div class="balloon balloon-four"></div>

        </div>


        <!-- =====================================================
             MAIN WELCOME CONTENT
        ====================================================== -->

        <section class="welcome-content">

            <!-- CHANGE NAME HERE -->
            <p class="small-intro">
                ایک خاص انسان کے نام
            </p>

            <!-- CHANGE NAME HERE -->
            <h1 class="person-name">
                حنا خان
            </h1>

            <!-- CHANGE BIRTHDAY HEADING HERE -->
            <h2 class="birthday-title">
                یومِ پیدائش مبارک
            </h2>

            <!-- CHANGE BIRTHDAY MESSAGE HERE -->
            <p class="birthday-message">
                حنا خان، آپ کو میری طرف سے یومِ پیدائش کی بہت بہت مبارکباد
            </p>

            <p class="dua-message">
                اللہ تعالیٰ آپ کی زندگی کو خوشیوں، محبت، سکون اور کامیابیوں سے بھر دے۔
            </p>


            <!-- =================================================
                 SPECIAL QUESTION CARD
            ================================================== -->

            <div class="question-card">

                <div class="question-heart">
                    ♥
                </div>

                <h3>
                    کیا آپ میری ہیں؟
                </h3>

                <!-- ONLY ONE BUTTON -->
                <button id="yesButton" class="yes-button">
                    جی ہاں
                    <span>❤️</span>
                </button>

            </div>

        </section>


        <!-- =====================================================
             HEART EXPLOSION CONTAINER
             JavaScript will add hearts here
        ====================================================== -->

        <div id="heartExplosion" class="heart-explosion"></div>


        <!-- Scroll hint -->
        <div class="scroll-hint">
            <span>آگے بڑھنے کے لیے</span>
            <span class="scroll-arrow">↓</span>
        </div>

    </main>


    <script src="js/welcome.js"></script>

</body>
</html>
